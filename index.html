<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCPEDL Addons Hub</title>
    <!-- Fuente Google -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Librerías de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-main: #f4f5f7;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-primary: #1c1e21;
            --text-secondary: #606770;
            --accent-green: #22c55e;
            --accent-green-hover: #16a34a;
            --border-color: #e4e6eb;
            --badge-bg: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-header: #181818;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --accent-green: #22c55e;
            --accent-green-hover: #16a34a;
            --border-color: #2a2a2a;
            --badge-bg: #2d3748;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); transition: background 0.3s; }

        /* Header Navbar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
        }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 22px; font-weight: 700; }
        .logo-green { color: var(--accent-green); }
        .menu-toggle, .theme-btn { background: none; border: none; font-size: 20px; color: var(--text-primary); cursor: pointer; }

        .search-bar {
            display: flex; flex: 1; max-width: 500px; margin: 0 20px;
            background-color: var(--bg-main); border-radius: 20px; padding: 4px 12px;
            border: 1px solid var(--border-color);
        }
        .search-bar input { width: 100%; border: none; background: transparent; color: var(--text-primary); outline: none; padding: 6px; }

        .btn-upload, .btn-primary {
            background-color: var(--accent-green); color: white; border: none;
            padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer;
        }

        /* Sidebar */
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 260px; height: 100%;
            background-color: var(--bg-header); border-right: 1px solid var(--border-color);
            z-index: 200; transition: left 0.3s ease; padding: 20px; display: flex; flex-direction: column; gap: 15px;
        }
        .sidebar.open { left: 0; }
        .btn-back { background: var(--badge-bg); border: none; color: var(--text-primary); padding: 8px; border-radius: 6px; cursor: pointer; text-align: left; }
        
        .user-profile-card { text-align: center; }
        .avatar-wrapper { position: relative; width: 70px; height: 70px; margin: 0 auto 10px; }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .change-avatar-btn { position: absolute; bottom: 0; right: 0; background: var(--accent-green); color: white; border-radius: 50%; padding: 4px; cursor: pointer; font-size: 12px; }

        /* Píldoras de Categorías */
        .category-pills { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; background-color: var(--bg-header); border-bottom: 1px solid var(--border-color); }
        .pill { background-color: var(--badge-bg); color: var(--text-primary); border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .pill.active { background-color: var(--accent-green); color: white; }

        /* Grid Galería MCPEDL */
        .main-container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .mcpedl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .mcpedl-card { background-color: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .card-image-wrapper { position: relative; width: 100%; height: 160px; }
        .card-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .category-tag { position: absolute; bottom: 8px; left: 8px; background-color: rgba(0,0,0,0.8); color: var(--accent-green); font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .card-content { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .card-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .like-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-weight: bold; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 300; }
        .modal-content { background: var(--bg-card); padding: 20px; border-radius: 8px; width: 90%; max-width: 450px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; }
        .modal form { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .modal input, .modal select, .modal textarea { padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-primary); }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <div class="nav-left">
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            <div class="logo"><span class="logo-green">MCPE</span><span>HUB</span></div>
        </div>
        <div class="search-bar">
            <input type="text" id="search-input" oninput="filterAddons()" placeholder="Buscar Addons...">
        </div>
        <div class="nav-right">
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
            <button class="btn-upload" onclick="openUploadModal()">+ Subir</button>
        </div>
    </header>

    <!-- Menú Lateral Sidebar -->
    <aside id="sidebar" class="sidebar">
        <button class="btn-back" onclick="toggleMenu()">⬅️ Atrás</button>
        <div class="user-profile-card">
            <div class="avatar-wrapper">
                <img id="menu-avatar" src="https://via.placeholder.com/80" alt="Avatar">
                <label for="avatar-input" class="change-avatar-btn">📷</label>
                <input type="file" id="avatar-input" accept="image/*" onchange="changeAvatar(event)" hidden>
            </div>
            <h3 id="menu-username" contenteditable="true">Steve_Player</h3>
        </div>
        <hr>
        <div>
            <p style="font-size: 13px;">Gama del dispositivo:</p>
            <strong id="device-tier">Detectando...</strong>
        </div>
    </aside>

    <!-- Categorías -->
    <div class="category-pills">
        <button class="pill active" onclick="setCategory('todos')">Todos</button>
        <button class="pill" onclick="setCategory('mods')">Mods / Behavior</button>
        <button class="pill" onclick="setCategory('shaders')">Shaders</button>
        <button class="pill" onclick="setCategory('texturas')">Texturas</button>
        <button class="pill" onclick="setCategory('mapas')">Mapas</button>
        <button class="pill" onclick="setCategory('skins')">Skins</button>
    </div>

    <!-- Galería Principal -->
    <main class="main-container">
        <section id="gallery" class="mcpedl-grid"></section>
    </main>

    <!-- Modal Subir Addon -->
    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeUploadModal()">&times;</span>
            <h2>Publicar Addon</h2>
            <form id="upload-form" onsubmit="handleUploadAddon(event)">
                <input type="text" id="addon-title" required placeholder="Título del Addon">
                <select id="addon-category" required>
                    <option value="mods">Mods / Behavior</option>
                    <option value="shaders">Shaders</option>
                    <option value="texturas">Texturas</option>
                    <option value="mapas">Mapas</option>
                    <option value="skins">Skins</option>
                </select>
                <textarea id="addon-desc" required placeholder="Descripción corta..."></textarea>
                <label style="font-size: 12px;">Imagen desde Galería:</label>
                <input type="file" id="addon-file-img" accept="image/*" required>
                <input type="url" id="addon-link" required placeholder="Enlace de Descarga (Mediafire/Mega)">
                <button type="submit" class="btn-primary">Publicar Addon</button>
            </form>
        </div>
    </div>

    <!-- Código de Lógica JavaScript -->
    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY_AQUÍ",
            authDomain: "tu-proyecto.firebaseapp.com",
            databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123def"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let addonsList = [];
        let selectedCategory = 'todos';
        const ADMIN_PASSWORD = "123";
        const DEFAULT_FALLBACK_IMAGE = "https://via.placeholder.com/300x160/1e1e1e/ffffff?text=Sin+Imagen";

        function startCloudListener() {
            db.ref('addons').on('value', (snapshot) => {
                const data = snapshot.val();
                addonsList = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        addonsList.push({ id: key, ...data[key] });
                    });
                }
                renderAddons();
            });
        }

        function renderAddons() {
            const gallery = document.getElementById('gallery');
            const searchText = document.getElementById('search-input').value.toLowerCase();
            gallery.innerHTML = '';

            const filtered = addonsList.filter(addon => {
                const matchesCat = selectedCategory === 'todos' || addon.category === selectedCategory;
                const matchesSearch = addon.title.toLowerCase().includes(searchText) || addon.description.toLowerCase().includes(searchText);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                gallery.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">No hay addons en esta sección.</p>';
                return;
            }

            filtered.forEach(addon => {
                const card = document.createElement('article');
                card.className = 'mcpedl-card';
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <img src="${addon.image || DEFAULT_FALLBACK_IMAGE}" onerror="this.onerror=null;this.src='${DEFAULT_FALLBACK_IMAGE}';">
                        <span class="category-tag">${addon.category}</span>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${addon.title}</h3>
                        <p class="card-desc">${addon.description}</p>
                        <div class="card-footer">
                            <button class="like-btn" onclick="likeAddon('${addon.id}', ${addon.likes || 0})">❤️ ${addon.likes || 0}</button>
                            <a href="${addon.downloadLink}" target="_blank" class="btn-primary">Descargar</a>
                        </div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function handleUploadAddon(e) {
            e.preventDefault();
            const fileInput = document.getElementById('addon-file-img');
            let imageDataUrl = DEFAULT_FALLBACK_IMAGE;

            if (fileInput.files[0]) {
                try { imageDataUrl = await convertFileToBase64(fileInput.files[0]); } catch (e) {}
            }

            const newAddon = {
                title: document.getElementById('addon-title').value,
                category: document.getElementById('addon-category').value,
                description: document.getElementById('addon-desc').value,
                image: imageDataUrl,
                downloadLink: document.getElementById('addon-link').value,
                likes: 0
            };

            db.ref('addons').push(newAddon).then(() => {
                alert("¡Addon publicado!");
                closeUploadModal();
                document.getElementById('upload-form').reset();
            });
        }

        async function changeAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const avatarDataUrl = await convertFileToBase64(file);
                document.getElementById('menu-avatar').src = avatarDataUrl;
                localStorage.setItem('userAvatar', avatarDataUrl);
            }
        }

        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
        function filterAddons() { renderAddons(); }
        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.pill').forEach(pill => pill.classList.remove('active'));
            if (event) event.target.classList.add('active');
            renderAddons();
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }

        function openUploadModal() {
            const pass = prompt("Introduce la contraseña para subir:");
            if (pass === ADMIN_PASSWORD) document.getElementById('upload-modal').style.display = 'flex';
            else if (pass !== null) alert("Contraseña incorrecta");
        }

        function closeUploadModal() { document.getElementById('upload-modal').style.display = 'none'; }
        function likeAddon(id, currentLikes) { db.ref('addons/' + id).update({ likes: currentLikes + 1 }); }

        function detectDevice() {
            const ram = navigator.deviceMemory || 4;
            const tierEl = document.getElementById('device-tier');
            if (ram <= 2) tierEl.innerText = "Gama Baja 📱";
            else if (ram <= 4) tierEl.innerText = "Gama Media ⚖️";
            else tierEl.innerText = "Gama Alta 🚀";
        }

        document.addEventListener('DOMContentLoaded', () => {
            detectDevice();
            startCloudListener();
            const savedAvatar = localStorage.getItem('userAvatar');
            if (savedAvatar) document.getElementById('menu-avatar').src = savedAvatar;
        });
    </script>
</body>
  </html>
